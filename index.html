<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .profile {
            width: 400px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .profile img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
            font-size: 16px;
        }

        .info {
            text-align: left;
            margin-top: 20px;
        }

        .info p {
            margin: 10px 0;
        }

        .info strong {
            color: #333;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="profile">

        <img src="profile.jpg" alt="Profile Photo">

        <h1>John Doe</h1>

        <p>Web Developer & Student</p>

        <div class="info">
            <p><strong>Age:</strong> 21</p>
            <p><strong>Location:</strong> Pune, Maharashtra</p>
            <p><strong>Education:</strong> B.Sc. Computer Science</p>
            <p><strong>Skills:</strong> HTML, CSS, JavaScript</p>
            <p><strong>Hobbies:</strong> Coding, Reading, Music</p>
            <p><strong>Email:</strong> johndoe@example.com</p>
        </div>

        <a href="#" class="btn">Contact Me</a>

    </div>

</body>
</html>
